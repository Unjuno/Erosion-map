name: Engine and Site CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Engine, WebAuthn, SQLite, site tests
        run: npm test
      - name: Synthetic performance measurement (Node 22)
        if: matrix.node == '22'
        run: npm run benchmark
      - name: Long-run 365-generation memory and output-size audit (Node 22)
        if: matrix.node == '22'
        run: npm run benchmark:365
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Upload static preview (no DB or account data)
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: erosion-map-static-preview
          path: site/
          if-no-files-found: error
          retention-days: 14
