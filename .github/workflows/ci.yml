name: Engine CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Package verified application
        run: |
          tar -czf application-bundle.tgz src server public scripts tests docs package.json package-lock.json tsconfig.json README.md .gitignore .github dist site node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: application-bundle
          path: application-bundle.tgz
          retention-days: 7
          if-no-files-found: error
